name: Test stable Windows publisher runtime
on:
  push:
    paths:
      - 'scripts/publish_lock.py'
      - 'scripts/system_health_check.py'
      - 'scripts/test_publish_lock.py'
      - 'scripts/test_system_health_check.py'
      - 'scripts/run_system_health_check.py'
      - 'scripts/zoomURL/run_zoom_publisher.py'
      - 'scripts/zoomURL/*.py'
      - '.github/workflows/test-system-runtime.yml'
  pull_request:
    paths:
      - 'scripts/publish_lock.py'
      - 'scripts/system_health_check.py'
      - 'scripts/test_publish_lock.py'
      - 'scripts/test_system_health_check.py'
      - 'scripts/run_system_health_check.py'
      - 'scripts/zoomURL/run_zoom_publisher.py'
      - 'scripts/zoomURL/*.py'
      - '.github/workflows/test-system-runtime.yml'
permissions:
  contents: read
env:
  # Match the installed launchers, which always run Python with -X utf8.
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  runtime:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_publish_lock.py
      - run: python -m unittest discover -s scripts -p test_system_health_check.py
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s scripts/zoomURL -p 'test_*.py'

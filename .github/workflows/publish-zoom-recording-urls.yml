name: Publish Zoom Recording URLs

on:
  schedule:
    # JST 16:25-16:35, 16:40/45/50/55
    - cron: '25-35 7 * * *'
    - cron: '40,45,50,55 7 * * *'
    # JST 18:15-18:25, 18:30/35/40/45
    - cron: '15-25 9 * * *'
    - cron: '30,35,40,45 9 * * *'
    # JST 20:05-20:15, 20:20/25/30/35
    - cron: '5-15 11 * * *'
    - cron: '20,25,30,35 11 * * *'
    # JST 21:55-22:05, 22:10/15/20/25
    - cron: '55-59 12 * * *'
    - cron: '0-5,10,15,20,25 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode. Scheduled runs publish automatically.'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - publish
      month:
        description: 'Target month such as 2026-08. Blank uses schedule_latest.json.'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: zoom-recording-url-publish
  cancel-in-progress: false

jobs:
  publish-zoom-recording-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install openpyxl

      - name: Validate required secrets
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
        run: |
          missing=0
          for name in ZOOM_ACCOUNT_ID ZOOM_CLIENT_ID ZOOM_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in GitHub Actions secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Zoom recording URL JSON
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_MONTH: ${{ inputs.month }}
        run: |
          args=()
          if [ -n "$DISPATCH_MONTH" ]; then
            args+=(--month "$DISPATCH_MONTH")
          fi

          # Scheduled runs publish automatically. Manual runs stay dry-run unless publish is selected.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "$DISPATCH_MODE" != "publish" ]; then
            args+=(--dry-run)
          fi

          python scripts/zoomURL/publish_zoom_recording_url_json.py "${args[@]}"

      - name: Create issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "Zoom録画URLクラウド公開失敗" --json number --jq 'length')
          if [ "$existing" -gt "0" ]; then
            echo "Failure issue already exists, skipping"
            exit 0
          fi
          gh issue create \
            --title "【要確認】Zoom録画URLクラウド公開失敗（$(date -u -d '+9 hours' '+%Y-%m-%d %H:%M')）" \
            --body "GitHub ActionsでZoom録画URL JSONの生成または公開に失敗しました。Actionsログを確認してください。現行Windowsタスクは止めていないため、PC側の自動公開は継続しています。"


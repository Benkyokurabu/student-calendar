name: Publish Zoom Recording URLs

on:
  push:
    paths:
      - '.github/workflows/publish-zoom-recording-urls.yml'
      - 'calendar.html'
      - 'lesson_prep.html'
      - 'scripts/zoomURL/zoom_recording_urls.py'
      - 'scripts/zoomURL/zoom_recording_url_list.py'
      - 'scripts/zoomURL/publish_zoom_recording_url_json.py'
      - 'scripts/zoomURL/test_zoom_lesson_only.py'
  schedule:
    # JST 16:25-16:35, 16:40/45/50/55
    - cron: '25-35 7 * * *'
    - cron: '40,45,50,55 7 * * *'
    # JST 18:15-18:25, 18:30/35/40/45
    - cron: '15-25 9 * * *'
    - cron: '30,35,40,45 9 * * *'
    # JST 20:05-20:15, 20:20/25/30/35
    - cron: '5-15 11 * * *'
    - cron: '20,25,30,35 11 * * *'
    # JST 21:55-22:05, 22:10/15/20/25
    - cron: '55-59 12 * * *'
    - cron: '0-5,10,15,20,25 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode. Scheduled runs publish automatically.'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - publish
      month:
        description: 'Target month such as 2026-08. Blank uses schedule_latest.json.'
        required: false
        default: ''
        type: string
      simulate_failure:
        description: 'Fail before publishing to verify the persistent cloud alert path.'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: zoom-recording-url-publish
  cancel-in-progress: false

jobs:
  publish-zoom-recording-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simulate failure for cloud alert verification
        # The push marker lets maintainers verify alerts without changing secrets or published JSON.
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.simulate_failure) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[test-zoom-cloud-alert]'))
        run: |
          echo "::error::Intentional failure for Zoom cloud alert verification. No recording data was published."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify both schedule pages use the shared Zoom JSON
        run: |
          for page in lesson_prep.html calendar.html; do
            if ! grep -q 'zoom_recording_urls_' "$page"; then
              echo "::error::$page does not reference the shared Zoom recording JSON"
              exit 1
            fi
          done

      - name: Install Python dependencies
        run: python -m pip install openpyxl

      - name: Verify lesson-only recording policy
        run: python -m unittest discover -s scripts/zoomURL -p 'test_zoom_lesson_only.py'

      - name: Validate required secrets
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
        run: |
          missing=0
          for name in ZOOM_ACCOUNT_ID ZOOM_CLIENT_ID ZOOM_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in GitHub Actions secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Zoom recording URL JSON
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_MONTH: ${{ inputs.month }}
        run: |
          args=()
          if [ -n "$DISPATCH_MONTH" ]; then
            args+=(--month "$DISPATCH_MONTH")
          fi

          # Scheduled runs publish automatically. Manual runs stay dry-run unless publish is selected.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "$DISPATCH_MODE" != "publish" ]; then
            args+=(--dry-run)
          fi

          python scripts/zoomURL/publish_zoom_recording_url_json.py "${args[@]}"

      - name: Record recovery on open incident
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue_number=$(gh issue list \
            --state open \
            --search '"Zoom録画URLクラウド公開失敗" in:title' \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$issue_number" ]; then
            echo "No open Zoom publishing incident"
            exit 0
          fi

          latest_state=$(gh issue view "$issue_number" \
            --json body,comments \
            --jq '[.body, (.comments[].body)] | last')

          if ! grep -q 'zoom-recording-publish-incident' <<<"$latest_state"; then
            echo "Recovery is already recorded for issue #$issue_number"
            exit 0
          fi

          recovered_at=$(date -u -d '+9 hours' '+%Y-%m-%d %H:%M JST')
          gh issue comment "$issue_number" --body "$(cat <<EOF
          <!-- zoom-recording-publish-recovery -->
          後続のクラウド公開が成功しました。

          - 復旧確認時刻: ${recovered_at}
          - 成功した実行: ${RUN_URL}

          障害内容の確認が終わるまで、このIssueは開いたまま保持します。
          EOF
          )"

      - name: Create issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.sha }}
        run: |
          failed_at=$(date -u -d '+9 hours' '+%Y-%m-%d %H:%M JST')
          issue_number=$(gh issue list \
            --state open \
            --search '"Zoom録画URLクラウド公開失敗" in:title' \
            --json number \
            --jq '.[0].number // empty')

          incident_body=$(cat <<EOF
          <!-- zoom-recording-publish-incident -->
          GitHub ActionsでZoom録画URL JSONの生成または公開に失敗しました。

          - 発生時刻: ${failed_at}
          - 実行: ${RUN_URL}
          - 起動方法: ${RUN_EVENT}
          - コミット: ${RUN_SHA}

          このIssueは後続実行が成功しても自動で閉じません。内容を確認し、必要な復旧と再実行を終えた後に手動で閉じてください。
          EOF
          )

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$incident_body"
            echo "Recorded recurrence in open issue #$issue_number"
          else
            gh issue create \
              --title "【要確認】Zoom録画URLクラウド公開失敗（${failed_at}）" \
              --body "$incident_body"
          fi


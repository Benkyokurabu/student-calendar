name: Test Supplementary Reader
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/*supplementary*', '.github/workflows/*supplementary*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl requests
      - run: python -m unittest discover -s scripts -p test_sync_supplementary_lessons.py -v
      - run: python -m unittest discover -s scripts -p test_bentan_journal_operation.py -v

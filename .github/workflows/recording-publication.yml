name: Apply Bentan Recording Publication
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/recording_publication_filter.py'
      - 'scripts/test_recording_publication_filter.py'
      - '.github/workflows/recording-publication.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: zoom-recording-url-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_recording_publication_filter.py
      - run: python scripts/recording_publication_filter.py
      - name: Commit filtered recording data
        id: publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add journal_*.json zoom_recording_*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply Bentan recording publication settings'
          git pull --rebase origin main
          git push origin main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Refresh published Pages JSON
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds --silent

name: Test student calendar

on:
  push:
    paths:
      - "calendar.html"
      - "teacher_calendar.html"
      - "calendar-mobile.css"
      - "calendar-mobile.js"
      - "scripts/test_calendar_mobile.mjs"
      - "schedule_*.json"
      - "scripts/test_calendar_state_migration.mjs"
      - "scripts/test_recording_link_priority.mjs"
      - ".github/workflows/test-student-calendar.yml"
      - ".github/workflows/publish-zoom-recording-urls.yml"
  pull_request:
    paths:
      - "calendar.html"
      - "teacher_calendar.html"
      - "calendar-mobile.css"
      - "calendar-mobile.js"
      - "scripts/test_calendar_mobile.mjs"
      - "schedule_*.json"
      - "scripts/test_calendar_state_migration.mjs"
      - "scripts/test_recording_link_priority.mjs"
      - ".github/workflows/test-student-calendar.yml"
      - ".github/workflows/publish-zoom-recording-urls.yml"

permissions:
  contents: read

jobs:
  calendar-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test_calendar_state_migration.mjs
      - run: node scripts/test_recording_link_priority.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test_calendar_mobile.mjs

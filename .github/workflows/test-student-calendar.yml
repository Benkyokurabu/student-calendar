name: Test student calendar

on:
  push:
    paths:
      - "calendar.html"
      - "teacher_calendar.html"
      - "calendar-mobile.css"
      - "calendar-mobile.js"
      - "scripts/test_calendar_mobile.mjs"
      - "schedule_*.json"
      - "scripts/test_calendar_state_migration.mjs"
      - "scripts/test_recording_link_priority.mjs"
      - "scripts/test_recording_release.mjs"
      - "scripts/zoomURL/recording_release.py"
      - "scripts/zoomURL/test_recording_release.py"
      - ".github/workflows/recording-release.yml"
      - ".github/workflows/test-student-calendar.yml"
      - ".github/workflows/publish-zoom-recording-urls.yml"
  pull_request:
    paths:
      - "calendar.html"
      - "teacher_calendar.html"
      - "calendar-mobile.css"
      - "calendar-mobile.js"
      - "scripts/test_calendar_mobile.mjs"
      - "schedule_*.json"
      - "scripts/test_calendar_state_migration.mjs"
      - "scripts/test_recording_link_priority.mjs"
      - "scripts/test_recording_release.mjs"
      - "scripts/zoomURL/recording_release.py"
      - "scripts/zoomURL/test_recording_release.py"
      - ".github/workflows/recording-release.yml"
      - ".github/workflows/test-student-calendar.yml"
      - ".github/workflows/publish-zoom-recording-urls.yml"

permissions:
  contents: read

jobs:
  calendar-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test_calendar_state_migration.mjs
      - run: node scripts/test_recording_link_priority.mjs
      - run: node scripts/test_recording_release.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python -m unittest discover -s scripts/zoomURL -p "test*.py"
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test_calendar_mobile.mjs
